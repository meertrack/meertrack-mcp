name: Publish

# Triggered on tags like v1.2.3. We deliberately don't trigger on every push to
# main — npm publishes are intentional, gated by tag.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: npm publish (with provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10.x, which signs provenance but does not exchange the
      # Actions OIDC token for an npm bearer — see the 1.0.2 CHANGELOG entry.
      # Pinned to the 11.x line rather than `@latest`: npm 12 requires Node
      # >=22.22.2 and `npm install -g npm@latest` began failing outright on this
      # runner. 11.x satisfies the >=11.5.1 the token exchange needs and still
      # supports the Node 20 floor this package declares in `engines`.
      - name: Upgrade npm (Trusted Publisher OIDC requires npm >=11.5.1)
        run: npm install -g npm@^11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$tag) does not match package.json version $pkg"
            exit 1
          fi

      - name: Version sync (package.json ↔ server.json)
        run: npm run check:version-sync

      - name: Changelog entry exists for this version
        run: npm run check:changelog

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/extract-changelog.mjs > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
